name: 每日资讯推送

on:
  schedule:
    # UTC 02:30 = 北京时间 10:30
    # 避开整点：GitHub 在整点高峰时段可能延迟甚至丢弃 scheduled 任务
    - cron: '30 2 * * *'
  workflow_dispatch: {}   # 支持在 Actions 页面手动触发，方便测试

permissions:
  contents: write   # 推送成功后把已推送记录 seen_urls.json 写回仓库

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt cursor-sdk

      - name: 安装并配置 lark-cli（bot 身份，无需扫码）
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
        run: |
          npm install -g @larksuite/cli
          printf '%s' "$LARK_APP_SECRET" | lark-cli config init --app-id "$LARK_APP_ID" --app-secret-stdin

      - name: 采集资讯
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
        run: python3 fetch_news.py

      - name: 生成报告（AI 整理优先，失败自动降级模板整理）
        id: report
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          python3 ai_report.py || python3 generate_report.py
          if [ -f "news_$(date +%Y%m%d).md" ]; then
            echo "has_report=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_report=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ 今日无新增资讯，跳过推送"
          fi

      - name: 推送到飞书
        if: steps.report.outputs.has_report == 'true'
        run: python3 push_to_feishu.py

      - name: 更新已推送记录（防止旧闻重复推送）
        run: |
          python3 mark_seen.py
          git add seen_urls.json
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "chore: 更新已推送记录 [skip ci]"
            git push
          fi

      - name: 归档当日产物（便于回查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-${{ github.run_id }}
          path: |
            raw_news_*.json
            news_*.md
          retention-days: 14
